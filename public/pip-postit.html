<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Post-it</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height:100%; background: transparent; overflow:hidden; }
  #root { display:flex; flex-direction:column; height:100vh; }
  .toolbar { display:flex; gap:6px; padding:6px; background:rgba(0,0,0,0.05); border-bottom:1px solid rgba(0,0,0,0.08); }
  .toolbar button { border:none; background:#fde68a; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
  .toolbar button:hover { background:#fcd34d; }
  .notes { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; background:#fafafa; }
  .note { background:#fef08a; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,0.08); display:flex; flex-direction:column; min-height:100px; }
  .note-head { display:flex; justify-content:flex-end; padding:2px 4px; background:rgba(0,0,0,0.04); }
  .note-head button { background:transparent; border:none; cursor:pointer; padding:2px 6px; font-size:14px; color:rgba(0,0,0,0.5); }
  .note textarea { flex:1; background:transparent; border:none; outline:none; resize:none; padding:8px 10px; font-size:13px; line-height:1.5; color:rgba(0,0,0,0.85); min-height:80px; font-family: inherit; }
  .empty { color:rgba(0,0,0,0.4); text-align:center; padding:20px; font-size:13px; }
</style>
</head>
<body>
<div id="root">
  <div class="toolbar">
    <button id="add">+ Nova nota</button>
  </div>
  <div class="notes" id="notes"></div>
</div>
<script>
  const STORAGE_KEY = "flora.globalPostIt";
  const channel = new BroadcastChannel("global-post-it-sync");

  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveNotes(notes, broadcast = true) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    if (broadcast) channel.postMessage({ type: "SYNC", notes });
  }

  let notes = loadNotes();

  function render() {
    const container = document.getElementById("notes");
    const open = notes.filter(n => n.isOpen);
    if (open.length === 0) {
      container.innerHTML = '<div class="empty">Nenhuma nota aberta. Clique em "+ Nova nota".</div>';
      return;
    }
    container.innerHTML = "";
    open.forEach(note => {
      const el = document.createElement("div");
      el.className = "note";
      el.style.background = note.color || "#fef08a";
      el.innerHTML = `
        <div class="note-head"><button data-close="${note.id}" title="Fechar">×</button></div>
        <textarea data-id="${note.id}" placeholder="Nota rápida...">${(note.text||"").replace(/</g,"&lt;")}</textarea>
      `;
      container.appendChild(el);
    });
    container.querySelectorAll("textarea").forEach(ta => {
      ta.addEventListener("input", (e) => {
        const id = e.target.dataset.id;
        notes = notes.map(n => n.id === id ? { ...n, text: e.target.value } : n);
        saveNotes(notes);
      });
    });
    container.querySelectorAll("button[data-close]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = e.currentTarget.dataset.close;
        notes = notes.filter(n => n.id !== id);
        saveNotes(notes);
        render();
      });
    });
  }

  document.getElementById("add").addEventListener("click", () => {
    notes.push({
      id: crypto.randomUUID(),
      text: "",
      color: "#fef08a",
      x: 100, y: 100, width: 250, height: 250,
      isOpen: true,
    });
    saveNotes(notes);
    render();
  });

  channel.onmessage = (ev) => {
    if (ev.data?.type === "SYNC") {
      notes = ev.data.notes || [];
      render();
    }
  };

  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY) { notes = loadNotes(); render(); }
  });

  // Ensure at least one note
  if (notes.filter(n => n.isOpen).length === 0) {
    notes.push({
      id: crypto.randomUUID(),
      text: "",
      color: "#fef08a",
      x: 100, y: 100, width: 250, height: 250,
      isOpen: true,
    });
    saveNotes(notes);
  }
  render();
</script>
</body>
</html>
